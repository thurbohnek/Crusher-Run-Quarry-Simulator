<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Crusher Run: Quarry Simulator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600;700&family=Saira+Stencil+One&family=Unbounded:wght@500;800&display=swap" rel="stylesheet">
<style>
/* Layout: one 9:16 board centred on screen. Canvas is the quarry; HTML on top is the operator's panel,
   the office between shifts and the handbook. Industrial palette: graphite, hi-vis amber, signal red. */
:root{
  --bg:#0f1012; --ink:#f1ece2; --muted:#a59f92; --dim:#6f6a62; --amber:#f2a51e; --amber-d:#9b6408; --red:#e1412a; --green:#8fc46a; --blue:#6fb3e0;
  --panel:rgba(18,19,22,.92); --panel2:#1b1d21; --card:#22252a; --line:rgba(241,236,226,.13);
  --disp:"Saira Stencil One", Impact, "Arial Black", sans-serif; --ui:"Barlow Condensed", "Arial Narrow", Arial, sans-serif; --brand:"Unbounded", "Arial Black", sans-serif;
  color-scheme:dark;
}
html{box-sizing:border-box;height:100%} *,*::before,*::after{box-sizing:inherit}
html,body{margin:0;background:var(--bg);color:var(--ink);overflow:hidden}
body{height:100%;position:relative;font-family:var(--ui);-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#wrap{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);overflow:hidden;background:#1a1a1a;--u:.5px}
#cv{display:block;width:100%;height:100%;touch-action:none}
html,body{touch-action:pan-x pan-y;-webkit-text-size-adjust:100%}
.ov{touch-action:pan-y}
button{font-family:inherit;color:inherit}
.hidden{display:none!important}

/* ---------- HUD ---------- */
.hud{position:absolute;left:0;right:0;top:0;display:grid;grid-template-columns:auto 1fr auto auto auto;align-items:center;gap:calc(var(--u)*16);
  padding:calc(var(--u)*12) calc(var(--u)*18);background:linear-gradient(rgba(12,13,15,.92),rgba(12,13,15,.55));border-bottom:calc(var(--u)*2) solid rgba(242,165,30,.45);pointer-events:none}
.hud .blk{display:flex;flex-direction:column;line-height:1.02;min-width:0}
.lab{font-size:calc(var(--u)*16);color:var(--muted);text-transform:uppercase;letter-spacing:.13em}
.val{font-size:calc(var(--u)*34);font-weight:700;font-variant-numeric:tabular-nums}
.val small{font-size:.55em;color:var(--muted);font-weight:600;margin-left:.2em}
.chip{display:inline-flex;align-items:center;gap:calc(var(--u)*6);font-size:calc(var(--u)*18);font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:calc(var(--u)*3) calc(var(--u)*10);border-radius:calc(var(--u)*4);background:#2a2d31;color:var(--ink)}
.chip.run{background:#294a22;color:#c7f0a6}.chip.warn{background:#5a3d0a;color:#ffd892}.chip.bad{background:#5e1c12;color:#ffc2b5;animation:blink .6s steps(2) infinite}
.chip.stop{background:#2c3e57;color:#cfe3ff}
@keyframes blink{50%{filter:brightness(1.4)}}
.prodline{font-size:calc(var(--u)*19);color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pause.spd{font-size:calc(var(--u)*22)}
.pause.spd.on{background:#f2a51e;color:#14161a;border-color:#f2a51e}
.card.tap{cursor:pointer}
.card .more{margin-top:calc(var(--u)*6);font-size:calc(var(--u)*17);color:#f2a51e;letter-spacing:.03em}
.card.warnc{border-color:#f2a51e}
#fLv{display:inline-block;width:calc(var(--u)*84);text-align:center}
#fSpd{display:inline-block;width:calc(var(--u)*120);white-space:nowrap}
.fslw{position:relative;width:calc(var(--u)*44);height:calc(var(--u)*300);flex-shrink:0}
.gauge.fslbox{padding:calc(var(--u)*10) calc(var(--u)*4)}
.fslw input.fsl{position:absolute;left:calc(var(--u)*-128);top:calc(var(--u)*128);width:calc(var(--u)*300);height:calc(var(--u)*44);transform:rotate(-90deg);accent-color:#f2a51e;margin:0;touch-action:none;cursor:pointer;pointer-events:none}
.gauge.fslbox{touch-action:none;cursor:pointer}
.fsl.hidden,.fc.hidden{display:none}
.gchip{font-size:calc(var(--u)*15);letter-spacing:.06em;color:#8fc46a;font-weight:700}
.gchip.hot{color:#ffb3a3}
.pause{pointer-events:auto;width:calc(var(--u)*56);height:calc(var(--u)*56);border-radius:calc(var(--u)*8);border:calc(var(--u)*2) solid var(--line);background:rgba(30,32,36,.9);font-size:calc(var(--u)*24);font-weight:700}
.gauges{position:absolute;right:calc(var(--u)*10);top:calc(var(--u)*560);display:flex;flex-direction:row;gap:calc(var(--u)*8);align-items:flex-start;pointer-events:none}
.gcol{display:flex;flex-direction:column;gap:calc(var(--u)*8);align-items:flex-end}
.feedctl{pointer-events:auto}
.fc{display:flex;align-items:center;gap:calc(var(--u)*10)}
.fc button{appearance:none;width:calc(var(--u)*48);height:calc(var(--u)*48);border-radius:calc(var(--u)*24);border:calc(var(--u)*2) solid rgba(241,236,226,.35);background:#25282d;color:var(--ink);font-size:calc(var(--u)*30);font-weight:700;line-height:1;cursor:pointer;touch-action:manipulation}
.gauge{background:rgba(14,15,17,.82);border:calc(var(--u)*2) solid var(--line);border-radius:calc(var(--u)*10);padding:calc(var(--u)*8) calc(var(--u)*10);display:flex;gap:calc(var(--u)*10);align-items:center}
.gauge svg{width:calc(var(--u)*92);height:calc(var(--u)*70)}
.gauge .gv{display:flex;flex-direction:column;line-height:1.05}
.gauge .gv b{font-size:calc(var(--u)*28);font-variant-numeric:tabular-nums}
.viewbtn{position:absolute;left:calc(var(--u)*16);top:calc(var(--u)*128);z-index:4;appearance:none;border:calc(var(--u)*2) solid rgba(241,236,226,.3);background:rgba(14,15,17,.82);color:var(--ink);font-weight:700;font-size:calc(var(--u)*22);letter-spacing:.04em;padding:calc(var(--u)*10) calc(var(--u)*16);border-radius:calc(var(--u)*30);cursor:pointer}
.viewbtn.hidden{display:none}
.otbtn{top:calc(var(--u)*196);border-color:rgba(255,190,80,.7);color:#ffd27a}
.goalc{position:absolute;left:calc(var(--u)*16);top:calc(var(--u)*196);z-index:4;width:calc(var(--u)*400);background:rgba(14,15,17,.86);border-left:calc(var(--u)*6) solid var(--amber);border-radius:0 calc(var(--u)*10) calc(var(--u)*10) 0;padding:calc(var(--u)*10) calc(var(--u)*14);display:flex;flex-direction:column;gap:calc(var(--u)*3);pointer-events:auto;cursor:pointer;transition:border-color .3s}
.goalc b{font-size:calc(var(--u)*24);line-height:1.1}
.goalc .how{font-size:calc(var(--u)*17);color:var(--muted);line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.goalc.done{border-left-color:var(--green)}.goalc.done .lab{color:var(--green)}
.goalbox{border-left:calc(var(--u)*6) solid var(--amber)}
.ms{display:flex;flex-direction:column;gap:calc(var(--u)*6)}
.msi{display:flex;gap:calc(var(--u)*12);align-items:flex-start;padding:calc(var(--u)*8) calc(var(--u)*10);background:var(--card);border-radius:calc(var(--u)*8);font-size:calc(var(--u)*21)}
.msi .tick{width:calc(var(--u)*28);color:var(--muted);font-weight:700;flex-shrink:0}
.msi.ok .tick{color:var(--green)}.msi.ok b{color:var(--muted)}
.msi b{display:block}.msi .spec{display:block;font-size:calc(var(--u)*17);color:var(--muted)}
.coach{position:absolute;inset:0;z-index:8;pointer-events:auto}
.coach .hole{position:absolute;border-radius:calc(var(--u)*14);box-shadow:0 0 0 9999px rgba(0,0,0,.66);border:calc(var(--u)*3) solid var(--amber);pointer-events:none}
.coach .bub{position:absolute;left:5%;width:90%;background:#1b1d21;border:calc(var(--u)*2) solid var(--amber);border-radius:calc(var(--u)*12);padding:calc(var(--u)*18) calc(var(--u)*20);display:flex;flex-direction:column;gap:calc(var(--u)*12);box-shadow:0 calc(var(--u)*10) calc(var(--u)*30) rgba(0,0,0,.6)}
.coach .bub p{font-size:calc(var(--u)*25);line-height:1.3}
.gauge.hot{border-color:var(--red);animation:blink .6s steps(2) infinite}
.toast{position:absolute;z-index:6;left:50%;bottom:calc(var(--u)*186);transform:translateX(-50%);width:84%;background:rgba(14,15,17,.94);border-left:calc(var(--u)*8) solid var(--amber);
  padding:calc(var(--u)*12) calc(var(--u)*18);font-size:calc(var(--u)*25);font-weight:600;line-height:1.22;pointer-events:none;opacity:0;transition:opacity .25s;text-wrap:pretty}
.toast.show{opacity:1}.toast.bad{border-left-color:var(--red)}.toast.good{border-left-color:var(--green)}

/* ---------- tools ---------- */
.tools{position:absolute;left:0;right:0;bottom:0;display:grid;grid-template-columns:repeat(5,1fr);gap:calc(var(--u)*8);padding:calc(var(--u)*10) calc(var(--u)*10) calc(var(--u)*14);
  background:linear-gradient(rgba(12,13,15,.4),rgba(12,13,15,.95))}
.tb{appearance:none;border:calc(var(--u)*3) solid rgba(241,236,226,.2);background:rgba(30,32,36,.94);font-weight:700;font-size:calc(var(--u)*23);text-transform:uppercase;letter-spacing:.05em;
  padding:calc(var(--u)*9) calc(var(--u)*4);border-radius:calc(var(--u)*8);display:flex;flex-direction:column;align-items:center;gap:calc(var(--u)*3);cursor:pointer;position:relative;overflow:hidden;touch-action:manipulation;min-height:calc(var(--u)*112)}
.tb svg{width:calc(var(--u)*40);height:calc(var(--u)*40)}
.tb small{font-size:calc(var(--u)*14);font-weight:500;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.tb.on{background:var(--amber);color:#1b1206;border-color:#ffd790}.tb.on small{color:#4a2e06}
.tb.red{background:#6d1f14;border-color:#ff9c88}.tb.green{background:#284a1f;border-color:#a7dd86}
.tb:focus-visible{outline:calc(var(--u)*4) solid #fff;outline-offset:calc(var(--u)*-6)}
.tb .auto{position:absolute;top:calc(var(--u)*6);right:calc(var(--u)*6);font-size:calc(var(--u)*13);padding:calc(var(--u)*2) calc(var(--u)*6);border-radius:calc(var(--u)*4);background:#2a2d31;color:var(--muted)}
.tb .auto.on{background:var(--green);color:#132008}
.tb .bar{position:absolute;left:0;bottom:0;height:calc(var(--u)*5);background:var(--amber);width:0}

/* ---------- overlays ---------- */
.ov{position:absolute;inset:0;display:flex;flex-direction:column;overflow-y:auto;overscroll-behavior:contain;background:rgba(12,13,15,.97);z-index:5}
.ov.clear{background:linear-gradient(rgba(10,10,12,.2),rgba(10,10,12,.85) 45%,rgba(10,10,12,.97))}
.ov>*{flex-shrink:0}
.pad{padding:calc(var(--u)*34) calc(var(--u)*34) calc(var(--u)*30);display:flex;flex-direction:column;gap:calc(var(--u)*18)}
h1.title{font-family:var(--disp);font-weight:400;font-size:calc(var(--u)*112);line-height:.86;margin:0;color:var(--amber);text-shadow:0 calc(var(--u)*6) 0 #3a2203;letter-spacing:.01em}
h2{font-family:var(--disp);font-weight:400;font-size:calc(var(--u)*54);line-height:.95;margin:0;color:var(--amber)}
h3{margin:calc(var(--u)*10) 0 0;font-size:calc(var(--u)*21);letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:700}
p,li{font-size:calc(var(--u)*25);line-height:1.32;margin:0}
p.lead{font-size:calc(var(--u)*28);max-width:34ch}
.muted{color:var(--muted)}
.row{display:flex;gap:calc(var(--u)*12);flex-wrap:wrap;align-items:center}
.btn{appearance:none;border:calc(var(--u)*3) solid rgba(241,236,226,.22);background:#25282d;font-weight:700;font-size:calc(var(--u)*27);letter-spacing:.05em;text-transform:uppercase;
  padding:calc(var(--u)*16) calc(var(--u)*24);border-radius:calc(var(--u)*8);cursor:pointer;touch-action:manipulation;white-space:nowrap}
.btn.pri{background:var(--amber);color:#1b1206;border-color:#ffd790}
.btn.sm{font-size:calc(var(--u)*20);padding:calc(var(--u)*10) calc(var(--u)*14)}
.btn[disabled]{opacity:.4;cursor:default}
.btn:focus-visible{outline:calc(var(--u)*4) solid #fff;outline-offset:calc(var(--u)*2)}
input[type=text]{font-family:var(--ui);font-size:calc(var(--u)*30);padding:calc(var(--u)*14) calc(var(--u)*16);border-radius:calc(var(--u)*8);border:calc(var(--u)*3) solid var(--line);background:#121316;color:var(--ink);width:100%}
input[type=range]{width:100%;accent-color:var(--amber);height:calc(var(--u)*44)}
.subtitle{font-family:var(--ui);font-weight:700;font-size:calc(var(--u)*30);letter-spacing:.32em;text-transform:uppercase;color:var(--ink);margin-top:calc(var(--u)*-6)}
.credit{font-family:var(--brand);font-size:calc(var(--u)*18);letter-spacing:.05em;color:var(--muted)}
.card{background:var(--card);border:calc(var(--u)*2) solid var(--line);border-radius:calc(var(--u)*10);padding:calc(var(--u)*16) calc(var(--u)*18);display:flex;flex-direction:column;gap:calc(var(--u)*8)}
.card .hd{display:flex;justify-content:space-between;gap:calc(var(--u)*12);align-items:flex-start}
.card .t{font-size:calc(var(--u)*28);font-weight:700;line-height:1.1}
.card .d{font-size:calc(var(--u)*21);color:#d6cfc0;line-height:1.28}
.card .spec{font-size:calc(var(--u)*18);color:var(--muted);letter-spacing:.03em;font-variant-numeric:tabular-nums}
.card.owned{opacity:.55}
.meter{height:calc(var(--u)*12);background:#0d0e10;border-radius:calc(var(--u)*6);overflow:hidden}
.meter i{display:block;height:100%;background:var(--green)}
.meter i.w{background:var(--amber)}.meter i.b{background:var(--red)}
.tabs{display:flex;gap:calc(var(--u)*4);overflow-x:auto;border-bottom:calc(var(--u)*2) solid var(--line);position:sticky;top:0;background:#121316;z-index:2;padding:0 calc(var(--u)*14);scrollbar-width:none}
.tabs button{appearance:none;background:none;border:0;border-bottom:calc(var(--u)*5) solid transparent;font-size:calc(var(--u)*21);font-weight:700;text-transform:uppercase;letter-spacing:.03em;padding:calc(var(--u)*16) calc(var(--u)*9);color:var(--muted);cursor:pointer;white-space:nowrap}
.tabs button.on{color:var(--ink);border-bottom-color:var(--amber)}
.ofhead{padding:calc(var(--u)*22) calc(var(--u)*24) calc(var(--u)*14);background:#121316;display:flex;flex-direction:column;gap:calc(var(--u)*8)}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:calc(var(--u)*10)}
.kpi{background:var(--panel2);border-radius:calc(var(--u)*8);padding:calc(var(--u)*10) calc(var(--u)*12)}
.kpi b{display:block;font-size:calc(var(--u)*30);font-variant-numeric:tabular-nums;line-height:1.1}
.kpi b.neg{color:#ff9c88}
.foot{position:sticky;bottom:0;margin-top:auto;padding:calc(var(--u)*16) calc(var(--u)*24) calc(var(--u)*22);background:linear-gradient(rgba(12,13,15,0),rgba(12,13,15,.98) 30%)}
.foot .btn{width:100%}
.ledger{display:grid;grid-template-columns:1fr auto;gap:calc(var(--u)*5) calc(var(--u)*16);font-size:calc(var(--u)*23);font-variant-numeric:tabular-nums}
.ledger span:nth-child(even){text-align:right;font-weight:700}
.ledger .pos{color:var(--green)}.ledger .neg{color:#ff9c88}
.ledger .tot{border-top:calc(var(--u)*2) solid var(--line);padding-top:calc(var(--u)*8);font-size:calc(var(--u)*30)}
.wear{display:flex;gap:calc(var(--u)*3);align-items:flex-end;height:calc(var(--u)*90)}
.wear i{flex:1;background:var(--green);border-radius:calc(var(--u)*2) calc(var(--u)*2) 0 0;min-height:2px}
.chart{width:100%;height:calc(var(--u)*170)}
table.st{width:100%;border-collapse:collapse;font-size:calc(var(--u)*22);font-variant-numeric:tabular-nums}
table.st td{padding:calc(var(--u)*6) 0;border-bottom:calc(var(--u)*1) solid var(--line)}
table.st td:last-child,table.st td:nth-child(2){text-align:right}
.hb svg{width:100%;height:auto;background:#191b1e;border-radius:calc(var(--u)*10)}
.hb dl{display:grid;grid-template-columns:calc(var(--u)*160) 1fr;gap:calc(var(--u)*8) calc(var(--u)*14);margin:0;font-size:calc(var(--u)*22)}
.hb dt{color:var(--amber);font-weight:700}.hb dd{margin:0;color:#ddd5c6}
#intro{position:absolute;inset:0;z-index:9;background:#0E1330;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:calc(var(--u)*40)}
#intro svg{width:calc(var(--u)*300);height:calc(var(--u)*300)}
#intro .wm{font-family:var(--brand);font-weight:800;font-size:calc(var(--u)*62);color:#fff;letter-spacing:-.02em;opacity:0;transform:translateY(calc(var(--u)*16));transition:all .6s ease .9s}
#intro.go .wm{opacity:1;transform:none}
#intro polyline{stroke-dasharray:200;stroke-dashoffset:200;transition:stroke-dashoffset .7s cubic-bezier(.6,0,.2,1)}
#intro.go polyline{stroke-dashoffset:0}
#intro.go polyline:nth-child(2){transition-delay:.18s}#intro.go polyline:nth-child(3){transition-delay:.36s}
#intro.out{opacity:0;transition:opacity .5s}
@media (prefers-reduced-motion:reduce){.chip.bad{animation:none}#intro polyline,#intro .wm{transition:none}}
</style>

<div id="wrap">
  <canvas id="cv"></canvas>

  <div class="hud hidden" id="hud">
    <div class="blk"><span class="lab" id="hDate">Monday</span><span class="val" id="hClock">07:00</span></div>
    <div class="blk"><span class="lab">Delivered today</span><span class="val" id="hTon">0 <small>t</small></span><span class="prodline" id="hProd">—</span></div>
    <div class="blk" style="text-align:right"><span class="lab">Value</span><span class="val" id="hKr">0</span><span id="hState" class="chip run" style="align-self:flex-end">Running</span></div>
    <button class="pause spd" id="bSpd" aria-label="Game speed">1×</button>
    <button class="pause" id="bPause" aria-label="Pause">II</button>
  </div>
  <div class="gauges hidden" id="gauges">
    <div class="gcol">
    <div class="gauge" id="gMotor">
      <svg viewBox="0 0 92 70" aria-hidden="true"><path d="M10 62 A38 38 0 0 1 82 62" fill="none" stroke="#2c2f33" stroke-width="9"/><path id="gArcG" d="M10 62 A38 38 0 0 1 66 30" fill="none" stroke="#6fa94e" stroke-width="9"/><path d="M66 30 A38 38 0 0 1 82 62" fill="none" stroke="#c9462e" stroke-width="9"/><line id="gNeedle" x1="46" y1="62" x2="14" y2="58" stroke="#f1ece2" stroke-width="3.5" stroke-linecap="round"/><circle cx="46" cy="62" r="5" fill="#f1ece2"/></svg>
      <div class="gv"><span class="lab">Motor</span><b id="gAmp">0 A</b><span class="lab" id="gRpm">0 rpm</span></div>
    </div>
    <div class="gauge"><div class="gv"><span class="lab">Jaw plates</span><b id="gPlate">—</b><span class="lab" id="gCss">CSS —</span><div class="fc hidden" id="cssCtl" style="pointer-events:auto"><button id="cMinus" aria-label="Tighter setting">−</button><button id="cPlus" aria-label="Wider setting">+</button></div><span class="gchip hidden" id="gHyd">HYDRAULIC</span></div></div>
    <div class="gauge feedctl"><div class="gv"><span class="lab">Feeder</span><div class="fc"><button id="fMinus" aria-label="Slower feeder">−</button><b id="fLv">3</b><button id="fPlus" aria-label="Faster feeder">+</button></div><span class="lab" id="fSpd">170 mm/s</span></div></div></div><div class="gauge feedctl fslbox hidden" id="fSlW"><div class="fslw"><input type="range" class="fsl" id="fSl" min="0" max="420" step="5" value="250" aria-label="Feeder speed in mm/s"></div></div>
  </div>
  <button class="viewbtn" id="bView" aria-label="Overview or close-up">⤢ Show all</button>
  <button class="viewbtn otbtn hidden" id="bOT">Overtime · End shift</button>
  <div class="goalc hidden" id="goal" role="button"><span class="lab" id="goalLab">Goal 1/22</span><b id="goalName">Tip the first load</b><span class="how" id="goalHow"></span></div>
  <div class="toast" id="toast"></div>

  <div class="tools hidden" id="tools">
    <button class="tb on" id="tHammer"><svg viewBox="0 0 40 40"><rect x="5" y="4" width="22" height="11" rx="1.5" transform="rotate(-32 16 9)" fill="currentColor"/><path d="M18 13 L33 36" stroke="currentColor" stroke-width="4.5" stroke-linecap="round"/></svg><span id="tHamName">Sledge</span><small id="tHamSub">hold and release</small></button>

<script>
'use strict';
/* ---- util.js ---- */
/* ============================================================
   util.js — math, seeded RNG, convex polygon helpers
   ============================================================ */
const TAU = Math.PI * 2;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (t) => t * t * (3 - 2 * t);

// mulberry32 — fast seeded RNG; the sim only uses this so test runs are reproducible
function makeRng(seed) {
  let s = seed >>> 0;
  const f = () => {
    s = (s + 0x6D2B79F5) >>> 0;
    let t = s;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
  f.range = (a, b) => a + (b - a) * f();
  f.int = (a, b) => Math.floor(a + (b - a + 1) * f());
  f.pick = (arr) => arr[Math.floor(f() * arr.length)];
  f.gauss = () => { let u = 0, v = 0; while (u === 0) u = f(); while (v === 0) v = f(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(TAU * v); };
  f.seed = () => s;
  return f;
}

const Poly = {
  area(p) { let a = 0; for (let i = 0, n = p.length; i < n; i++) { const q = p[i], r = p[(i + 1) % n]; a += q.x * r.y - r.x * q.y; } return a / 2; },
  centroid(p) {
    let a = 0, cx = 0, cy = 0;
    for (let i = 0, n = p.length; i < n; i++) { const q = p[i], r = p[(i + 1) % n]; const c = q.x * r.y - r.x * q.y; a += c; cx += (q.x + r.x) * c; cy += (q.y + r.y) * c; }
    a /= 2;
    if (Math.abs(a) < 1e-9) { let x = 0, y = 0; for (const q of p) { x += q.x; y += q.y; } return { x: x / p.length, y: y / p.length }; }
    return { x: cx / (6 * a), y: cy / (6 * a) };
  },
  // polar moment of inertia about the centroid, per unit density (polygon must be centred)
  inertia(p) {
    let num = 0, den = 0;
    for (let i = 0, n = p.length; i < n; i++) {
      const a = p[i], b = p[(i + 1) % n];
      const cr = Math.abs(a.x * b.y - b.x * a.y);
      num += cr * (a.x * a.x + a.x * b.x + b.x * b.x + a.y * a.y + a.y * b.y + b.y * b.y);
      den += cr;
    }
    return den ? num / (6 * den) : 0; // inertia per unit mass (I/m) about the origin
  },
  hull(pts) {
    pts = pts.slice().sort((a, b) => a.x - b.x || a.y - b.y);
    const cr = (o, a, b) => (a.x - o.x) * (b.y - o.y) - (a.y - o.y) * (b.x - o.x);
    const lo = [], up = [];
    for (const p of pts) { while (lo.length >= 2 && cr(lo[lo.length - 2], lo[lo.length - 1], p) <= 1e-9) lo.pop(); lo.push(p); }
    for (let i = pts.length - 1; i >= 0; i--) { const p = pts[i]; while (up.length >= 2 && cr(up[up.length - 2], up[up.length - 1], p) <= 1e-9) up.pop(); up.push(p); }
    up.pop(); lo.pop(); return lo.concat(up);
  },
  // CCW (in y-down screen coords this is the order with positive area by the shoelace formula)
  ensureCCW(p) { if (Poly.area(p) < 0) p.reverse(); return p; },
  // Half-plane clip keeping (q - P)·n <= 0. Each vertex carries f = "edge from here to next is fresh fracture".
  clip(poly, px, py, nx, ny) {
    const out = [], n = poly.length;
    for (let i = 0; i < n; i++) {
      const a = poly[i], b = poly[(i + 1) % n];
      const da = (a.x - px) * nx + (a.y - py) * ny, db = (b.x - px) * nx + (b.y - py) * ny;
      if (da <= 0) {
        out.push({ x: a.x, y: a.y, f: a.f });
        if (db > 0) { const t = da / (da - db); out.push({ x: a.x + (b.x - a.x) * t, y: a.y + (b.y - a.y) * t, f: true }); }
      } else if (db <= 0) {
        const t = da / (da - db); out.push({ x: a.x + (b.x - a.x) * t, y: a.y + (b.y - a.y) * t, f: a.f });
      }
    }
    return out;
  },
  // remove near-duplicate and near-collinear vertices so the solver gets clean convex shapes
  simplify(p, minEdge = 2.2, colTol = 0.012) {
    let pts = p.slice();
    let changed = true, guard = 0;
    while (changed && pts.length > 3 && guard++ < 50) {
      changed = false;
      for (let i = 0; i < pts.length && pts.length > 3; i++) {
        const a = pts[(i - 1 + pts.length) % pts.length], b = pts[i], c = pts[(i + 1) % pts.length];
        const lab = Math.hypot(b.x - a.x, b.y - a.y), lbc = Math.hypot(c.x - b.x, c.y - b.y);
        const cr = ((b.x - a.x) * (c.y - b.y) - (b.y - a.y) * (c.x - b.x)) / ((lab * lbc) || 1);
        if (lbc < minEdge || Math.abs(cr) < colTol) {
          // drop b; the merged edge a->c is fresh if either part was
          a.f = a.f || b.f;
          pts.splice(i, 1); changed = true; i--;
        }
      }
    }
    return pts;
  },
  radius(p) { let r = 0; for (const q of p) r = Math.max(r, Math.hypot(q.x, q.y)); return r; },
  perimeter(p) { let s = 0; for (let i = 0; i < p.length; i++) { const a = p[i], b = p[(i + 1) % p.length]; s += Math.hypot(b.x - a.x, b.y - a.y); } return s; },
  freshFrac(p) { let t = 0, f = 0; for (let i = 0; i < p.length; i++) { const a = p[i], b = p[(i + 1) % p.length]; const l = Math.hypot(b.x - a.x, b.y - a.y); t += l; if (a.f) f += l; } return t ? f / t : 0; },
  contains(p, x, y) { // convex CCW
    for (let i = 0, n = p.length; i < n; i++) { const a = p[i], b = p[(i + 1) % n]; if ((b.x - a.x) * (y - a.y) - (b.y - a.y) * (x - a.x) < 0) return false; }
    return true;
  },
  // smallest width (caliper) of a convex polygon — used as the "particle size" a screen sees
  minWidth(p) {
    let best = Infinity;
    for (let i = 0, n = p.length; i < n; i++) {
      const a = p[i], b = p[(i + 1) % n], ex = b.x - a.x, ey = b.y - a.y, l = Math.hypot(ex, ey) || 1;
      const nx = -ey / l, ny = ex / l;
      let mn = Infinity, mx = -Infinity;
      for (const q of p) { const d = q.x * nx + q.y * ny; if (d < mn) mn = d; if (d > mx) mx = d; }
      best = Math.min(best, mx - mn);
    }
    return best;
  },
  perimPoint(p, s) {
    const n = p.length; let acc = 0;
    for (let i = 0; i < n; i++) { const a = p[i], b = p[(i + 1) % n], l = Math.hypot(b.x - a.x, b.y - a.y); if (acc + l >= s) { const t = l ? (s - acc) / l : 0; return { x: a.x + (b.x - a.x) * t, y: a.y + (b.y - a.y) * t, i }; } acc += l; }
    return { x: p[0].x, y: p[0].y, i: 0 };
  },
  // arc-length position of the closest boundary point to (x,y)
  perimParam(p, x, y) {
    let per = 0, best = 0, bd = Infinity;
    for (let i = 0, n = p.length; i < n; i++) {
      const a = p[i], b = p[(i + 1) % n], dx = b.x - a.x, dy = b.y - a.y, l2 = dx * dx + dy * dy, l = Math.sqrt(l2);
      const t = l2 ? clamp(((x - a.x) * dx + (y - a.y) * dy) / l2, 0, 1) : 0;
      const d = Math.hypot(a.x + dx * t - x, a.y + dy * t - y);
      if (d < bd) { bd = d; best = per + t * l; }
      per += l;
    }
    return { s: best, per, d: bd };
  }
};

// money is kept internally in one unit; the player picks the currency it is shown in (Settings)
const CURRENCIES = {
  USD: { sym: '$', rate: 0.093, pre: true, name: 'US dollar' },
  EUR: { sym: '€', rate: 0.086, pre: true, name: 'Euro' },
  GBP: { sym: '£', rate: 0.074, pre: true, name: 'Pound sterling' },
  NOK: { sym: 'kr', rate: 1, pre: false, name: 'Krone' }
};
const fmt = {
  cur: (() => { try { return localStorage.getItem('rc_cur') || 'USD'; } catch (e) { return 'USD'; } })(),
  setCur(c) { if (CURRENCIES[c]) { this.cur = c; try { localStorage.setItem('rc_cur', c); } catch (e) {} } },
  t(v) { return v >= 100 ? Math.round(v).toLocaleString('en-GB') : v.toFixed(1); },
  // whole amounts: rounded to a sensible step in the chosen currency
  kr(v) {
    const C = CURRENCIES[this.cur] || CURRENCIES.USD, x = Math.abs(v) * C.rate;
    const n = Math.round(x).toLocaleString('en-GB'), sg = v < 0 ? '−' : '';
    return C.pre ? sg + C.sym + n : sg + n + ' ' + C.sym;
  },
  // prices per tonne: small numbers, so one decimal in the strong currencies
  pt(v) {
    const C = CURRENCIES[this.cur] || CURRENCIES.USD, x = v * C.rate;
    const n = x < 100 ? x.toFixed(2) : Math.round(x).toLocaleString('en-GB');
    return (C.pre ? C.sym + n : n + ' ' + C.sym) + '/t';
  },
  pct(v) { return Math.round(v * 100) + '%'; }
};

/* ---- phys.js ---- */
/* ============================================================
   phys.js — a small 2D rigid body engine for convex polygons
   Box2D-style: SAT + reference-face clipping manifolds, persistent
   contacts with warm starting, sequential impulses with speculative
   contacts (no tunnelling at quarry speeds), non-linear Gauss-Seidel
   position correction, surface velocity for conveyor belts,
   kinematic bodies for the swing jaw, island-free sleeping.
   Units: px, s, kg.
   ============================================================ */
const Phys = (() => {
  const STATIC = 0, DYNAMIC = 1, KINEMATIC = 2;
  let shapeSeq = 1, bodySeq = 1;

  class Shape {
    constructor(body, verts, o = {}) {
      this.id = shapeSeq++;
      this.body = body;
      this.friction = o.friction ?? 0.6;
      this.restitution = o.restitution ?? 0.1;
      this.surfaceVel = o.surfaceVel || null;   // {x,y} surface motion (conveyor)
      this.tag = o.tag || null;
      this.user = o.user || null;
      this.wv = []; this.wn = [];
      this.aabb = { x0: 0, y0: 0, x1: 0, y1: 0 };
      this.setVerts(verts);
    }
    setVerts(verts) {
      const v = verts.map(p => ({ x: p.x, y: p.y }));
      if (Poly.area(v) < 0) v.reverse();
      this.lv = v; this.ln = [];
      for (let i = 0; i < v.length; i++) {
        const a = v[i], b = v[(i + 1) % v.length], dx = b.x - a.x, dy = b.y - a.y, l = Math.hypot(dx, dy) || 1;
        this.ln.push({ x: dy / l, y: -dx / l });
      }
      const c = Poly.centroid(v); this.lcx = c.x; this.lcy = c.y;
      let r = 0; for (const q of v) r = Math.max(r, Math.hypot(q.x - c.x, q.y - c.y)); this.lr = r;
      while (this.wv.length < v.length) { this.wv.push({ x: 0, y: 0 }); this.wn.push({ x: 0, y: 0 }); }
      this.wv.length = v.length; this.wn.length = v.length;
      if (this.body) this.body.dirty = true;
    }
  }

  class Body {
    constructor(type, x = 0, y = 0, a = 0) {
      this.id = bodySeq++;
      this.type = type;
      this.x = x; this.y = y; this.a = a;
      this.vx = 0; this.vy = 0; this.w = 0;
      this.fx = 0; this.fy = 0; this.tq = 0;
      this.m = 0; this.invM = 0; this.I = 0; this.invI = 0;
      this.shapes = [];
      this.linDamp = 0.1; this.angDamp = 1.5;
      this.gravityScale = 1;
      this.cat = 1; this.mask = 0xFFFF;
      this.awake = true; this.sleepT = 0; this.canSleep = true;
      this.world = null; this.dead = false;
      this.c = 1; this.s = 0;
      this.user = null;
      // per-step contact summary (filled by the solver)
      this.impX = 0; this.impY = 0; this.impAbs = 0; this.touch = [];
      this.dirty = true;
    }
    addShape(verts, o) { const s = new Shape(this, verts, o); this.shapes.push(s); if (this.world) this.world._addProxy(s); return s; }
    setMass(m, I) {
      if (this.type !== DYNAMIC) { this.m = this.invM = this.I = this.invI = 0; return; }
      this.m = m; this.invM = m > 0 ? 1 / m : 0; this.I = I; this.invI = I > 0 ? 1 / I : 0;
    }
    wake() { if (this.type === DYNAMIC && !this.awake) { this.awake = true; this.sleepT = 0; } else this.sleepT = 0; }
    applyImpulse(px, py, wx, wy) {
      if (this.type !== DYNAMIC) return;
      this.wake();
      this.vx += px * this.invM; this.vy += py * this.invM;
      this.w += this.invI * ((wx - this.x) * py - (wy - this.y) * px);
    }
    applyForce(fx, fy, wx, wy) {
      if (this.type !== DYNAMIC) return;
      this.wake();
      this.fx += fx; this.fy += fy;
      if (wx !== undefined) this.tq += (wx - this.x) * fy - (wy - this.y) * fx;
    }
    velAt(px, py) { return { x: this.vx - this.w * (py - this.y), y: this.vy + this.w * (px - this.x) }; }
    toLocal(px, py) { const c = Math.cos(this.a), s = Math.sin(this.a), dx = px - this.x, dy = py - this.y; return { x: dx * c + dy * s, y: -dx * s + dy * c }; }
    toWorld(lx, ly) { const c = Math.cos(this.a), s = Math.sin(this.a); return { x: this.x + lx * c - ly * s, y: this.y + lx * s + ly * c }; }
  }

  function updateShape(s, margin) {
    const b = s.body, c = b.c, sn = b.s, lv = s.lv, ln = s.ln, wv = s.wv, wn = s.wn;
    let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
    for (let i = 0; i < lv.length; i++) {
      const p = lv[i], q = wv[i];
      q.x = b.x + p.x * c - p.y * sn; q.y = b.y + p.x * sn + p.y * c;
      const n = ln[i], m = wn[i];
      m.x = n.x * c - n.y * sn; m.y = n.x * sn + n.y * c;
      if (q.x < x0) x0 = q.x; if (q.x > x1) x1 = q.x; if (q.y < y0) y0 = q.y; if (q.y > y1) y1 = q.y;
    }
    s.wcx = b.x + s.lcx * c - s.lcy * sn; s.wcy = b.y + s.lcx * sn + s.lcy * c;
    const a = s.aabb;
    // expand along the motion so speculative contacts see what is coming
    const ex = Math.abs(b.vx) * margin + 2, ey = Math.abs(b.vy) * margin + 2, er = Math.abs(b.w) * margin * 30;
    a.x0 = x0 - ex - er; a.x1 = x1 + ex + er; a.y0 = y0 - ey - er; a.y1 = y1 + ey + er;
  }

  // ---------- narrow phase ----------
  let _msI = 0, _msS = 0;
  function maxSep(A, B, lim) {
    let best = -Infinity, bi = 0;
    const av = A.wv, an = A.wn, bv = B.wv, nb = bv.length;
    for (let i = 0; i < av.length; i++) {
      const n = an[i], v = av[i], nx = n.x, ny = n.y, vx = v.x, vy = v.y;
      let mn = Infinity;
      for (let j = 0; j < nb; j++) { const q = bv[j]; const d = nx * (q.x - vx) + ny * (q.y - vy); if (d < mn) mn = d; }
      if (mn > best) { best = mn; bi = i; if (mn > lim) break; }
    }
    _msI = bi; _msS = best;
  }
  const _c = [{ x: 0, y: 0, id: 0 }, { x: 0, y: 0, id: 0 }, { x: 0, y: 0, id: 0 }];
  const _o = [{ x: 0, y: 0, id: 0 }, { x: 0, y: 0, id: 0 }, { x: 0, y: 0, id: 0 }];
  function clipSeg(inp, out, nx, ny, off) {
    let n = 0;
    const p0 = inp[0], p1 = inp[1];
    const d0 = nx * p0.x + ny * p0.y - off, d1 = nx * p1.x + ny * p1.y - off;
    if (d0 <= 0) { out[n].x = p0.x; out[n].y = p0.y; out[n].id = p0.id; n++; }
    if (d1 <= 0) { out[n].x = p1.x; out[n].y = p1.y; out[n].id = p1.id; n++; }
    if (d0 * d1 < 0) {
      const t = d0 / (d0 - d1);
      out[n].x = p0.x + t * (p1.x - p0.x); out[n].y = p0.y + t * (p1.y - p0.y); out[n].id = d0 > 0 ? p0.id : p1.id; n++;
    }
    return n;
  }
  // manifold scratch
  const M = { nx: 0, ny: 0, flip: false, rnx: 0, rny: 0, v11x: 0, v11y: 0, n: 0, pts: [{}, {}] };
  // prefFlip: the reference choice used last step (hysteresis keeps warm starting intact)
  function collide(A, B, margin, prefFlip) {
    const cdx = A.wcx - B.wcx, cdy = A.wcy - B.wcy, rr = A.lr + B.lr + margin;
    if (cdx * cdx + cdy * cdy > rr * rr) return null;
    maxSep(A, B, margin); const ea = _msI, sa = _msS; if (sa > margin) return null;
    maxSep(B, A, margin); const eb = _msI, sb = _msS; if (sb > margin) return null;
    let flip;
    if (prefFlip === true) flip = !(sa > sb + 0.1);
    else if (prefFlip === false) flip = sb > sa + 0.1;
    else flip = sb > sa + 0.05;
    const ref = flip ? B : A, inc = flip ? A : B, edge = flip ? eb : ea;
    const rn = ref.wn[edge], rv = ref.wv, iv = inc.wv, inn = inc.wn;
    let ie = 0, mind = Infinity;
    for (let k = 0; k < inn.length; k++) { const d = rn.x * inn[k].x + rn.y * inn[k].y; if (d < mind) { mind = d; ie = k; } }
    const ie2 = (ie + 1) % iv.length;
    const v11 = rv[edge], v12 = rv[(edge + 1) % rv.length];
    let tx = v12.x - v11.x, ty = v12.y - v11.y; const tl = Math.hypot(tx, ty) || 1; tx /= tl; ty /= tl;
    _c[0].x = iv[ie].x; _c[0].y = iv[ie].y; _c[0].id = ie;
    _c[1].x = iv[ie2].x; _c[1].y = iv[ie2].y; _c[1].id = ie2;
    if (clipSeg(_c, _o, -tx, -ty, -(tx * v11.x + ty * v11.y)) < 2) return null;
    if (clipSeg(_o, _c, tx, ty, tx * v12.x + ty * v12.y) < 2) return null;
    let n = 0;
    for (let k = 0; k < 2; k++) {
      const p = _c[k];
      const sep = rn.x * (p.x - v11.x) + rn.y * (p.y - v11.y);
      if (sep <= margin) {
        const o = M.pts[n++];
        o.x = p.x - rn.x * sep * 0.5; o.y = p.y - rn.y * sep * 0.5; o.px = p.x; o.py = p.y; o.sep = sep;
        o.id = (edge << 12) | (p.id & 0xfff) | (flip ? 0x80000 : 0);
      }
    }
    if (!n) return null;
    M.n = n; M.flip = flip; M.ref = ref; M.inc = inc;
    M.nx = flip ? -rn.x : rn.x; M.ny = flip ? -rn.y : rn.y; M.rnx = rn.x; M.rny = rn.y; M.v11x = v11.x; M.v11y = v11.y;
    return M;
  }

  // ---------- world ----------

/* ============================================================
   sim.js — the crusher world: physics, rocks, fines, feeding,
   the operator's tools, delivery and the day's measurements.
   No DOM here, so it runs headless in tests.
   Time: the physics runs in real time; a day's accounting is a
   time-lapse (TL) of the 8-hour shift.
   ============================================================ */
const DAY_LEN = 150;                      // seconds of play per shift
const TL = 8 * 3600 / DAY_LEN;            // real seconds of plant time per played second

class Sim {
  constructor(save, opt = {}) {
    this.save = save;                     // machine part of the career save (tier, css, wear, upgrades)
    this.rng = makeRng(opt.seed ?? (Date.now() & 0xffffff));
    this.tier = TIERS[save.tier];
    this.mmpx = Machine.mmpxOf(this.tier);
    // the side view shows one slice of the chamber: a wider jaw (600, 900, 1200, 1500 mm) has more slices side by side
    this.W = [1, 1.15, 1.3, 1.45][save.tier] || 1; this.TLm = TL * this.W;
    this.g = 9810 / this.mmpx;            // real gravity in px/s²
    this.beltV = 1250 / this.mmpx;        // 1.25 m/s belt

    const up = save.up || {};

    this.health = (0.75 + 0.25 * (save.bearing ?? 1)) * (0.82 + 0.18 * (save.vbelt ?? 1));
    this.rocks = []; this.parts = []; this.fx = []; this.time = 0; this.stepN = 0;
    this.weather = opt.weather || { wet: 0 };
    this.tool = null; this.sledge = null; this.pry = null; this.lift = null; this.breaker = null;
    this.loader = { queue: [], t: 0, busy: false, cd: 0 };
    this.D = this.newDay();

    Machine.initDrive(this);
    this.grid = new Map(); this.gridT = 0;

  }
  newDay() {
    return { tonnes: 0, kg: 0, hist: new Float64Array(12), byMat: {}, kWh: 0, crushes: 0, blows: 0, spalls: 0, splits: 0, trips: 0, toggles: 0, reliefs: 0, clears: 0,
      rejectT: 0, bySrc: {}, steelOut: 0, scrap: 0, maxAmps: 0, fedT: 0, dumps: 0, jamT: 0, oversizeIn: 0 };
  }
  emit(t, o = {}) { o.t = t; this.fx.push(o); if (this.fx.length > 400) this.fx.splice(0, 100); }

      M.state = 'trip'; M.timer = 150 / TL; /* thermal relay cools ~2½ min */ this.D.trips++; this.emit('trip');
    } else if (type === 'toggle' && (M.state === 'run' || M.state === 'relief') && !M.toggleBroken) {

      else { M.timer = 3 * 3600 / TL; /* no spare: fetch one from town, ~3 h */ this.D.toggleKr = (this.D.toggleKr || 0) + this.tier.toggle * 1.25 + 2500; }

  // ---------- rocks ----------
  static sieveSize(minW, De, thMm) { const v = [minW, De * 1.1, thMm].sort((p, q) => p - q); return v[1]; }

  }
  let pid = null;
  cv.addEventListener('pointerdown', (e) => {
    Sound.init();
    if (mode !== 'shift' || paused || pid !== null || pinching) return;
    if (!tool) { panP = scr(e); pid = e.pointerId; cv.setPointerCapture(e.pointerId); return; }
    const p = toWorld(e);
    if (tool === 'hammer') {
      if (sim.up.breaker) {
        if (!sim.breakerReach(p.x, p.y)) { toast('The hydraulic breaker can\'t reach there.', 1600); return; }
        br = { x: p.x, y: p.y, on: true, t: 0 };
      } else {
        if (sl) return;
        sl = { state: 'charge', x: p.x, t: 0, charge: 0, sx0: scr(e).x, wx0: p.x };
      }
    } else if (tool === 'pry') {
      const r = sim.pryStart(p.x, p.y);
      if (!r.ok) { if (r.why === 'running') { toast('Stop and lock out the crusher before going into the jaw with the pry bar.', 3400, 'bad'); sim.emit('deny'); } return; }
    } else if (tool === 'lift') {
      const r = sim.liftStart(p.x, p.y);
      if (!r.ok) {
        if (r.why === 'running') { toast('Never lift out of a running jaw. Stop the crusher first.', 3400, 'bad'); sim.emit('deny'); }
        else if (r.why === 'deep') { toast('Too deep for a chain: there is no room to get it round a block down between the plates. Break it' + (sim.up.breaker ? ' with the breaker' : ' with the sledge') + ', lever it with the pry bar, or stop and ' + (sim.up.hydro ? 'open the setting' : 'take out the shims') + ' so the chamber drops.', 4800, 'bad'); sim.emit('deny'); }
        else if (r.why === 'covered') { toast('Another stone lies on top of it. Lift the top one first.', 2600); sim.emit('deny'); }
      }
      else hint('lift', 'The chain hooks the block onto the hoist. Take the top ones first so the rest don\'t lock up.');
      return;
    }
    pid = e.pointerId; cv.setPointerCapture(e.pointerId);
  });
  cv.addEventListener('pointermove', (e) => {
    if (e.pointerId !== pid || pinching) return;
    if (panP) { if (pinching) { panP = null; return; } const q = scr(e); Render.panBy(sim, clamp(q.x - panP.x, -120, 120), clamp(q.y - panP.y, -120, 120)); panP = q; return; }
    const p = toWorld(e);
    if (sl && sl.state === 'charge') sl.x = p.x;
    if (br) { if (sim.breakerReach(p.x, p.y)) { br.x = p.x; br.y = p.y; } }
    if (sim && sim.pry) { sim.pry.tx = p.x; sim.pry.ty = p.y; }
  });
  const up = (e) => {
    if (e.pointerId !== pid) return; pid = null;
    if (panP) { panP = null; return; }
    if (sl && sl.state === 'charge') {
      const c = sim.sledgeCheck(sl.x);
      if (c.ok) { sl.state = 'swing'; sl.t = 0; }
      else {
        if (c.why === 'running') { toast('Deadly! Never swing a sledgehammer down in the jaw while it runs. Only on top of blocks sticking up in the feed opening.', 4200, 'bad'); sim.emit('deny'); }
        else if (c.why === 'deep') toast('You can\'t reach down there with the sledgehammer. Use the pry bar or chain.', 2800);
        else if (c.why === 'reach') toast('You can\'t reach that from the walkway.', 2200);
        sl = null;
      }
    }
    br = null;
    if (sim) sim.pry = null;
  };
  cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', up);

  // ---------- HUD ----------
  function updateHud() {
    const M = sim.m, T = sim.tier;
    if (sim.up.hydro) { const rel = M.state === 'relief'; const el = $('gHyd'); el.textContent = rel ? 'RELIEF · OPEN' : cssNow !== cssWant ? 'SETTING → ' + cssWant + ' mm' : 'HYDRAULIC'; el.classList.toggle('hot', rel); }
    const hour = 7 + 8 * shiftT / DAY_LEN, hh = Math.floor(hour), mm = Math.floor((hour - hh) * 60);
    $('hClock').textContent = String(hh).padStart(2, '0') + ':' + String(mm).padStart(2, '0');
    $('hTon').innerHTML = `${tt(sim.D.tonnes)} <small>t</small>`;
    const prod = Career.classify(save, sim.D.hist, sim.D.tonnes), d95 = Career.d95(Array.from(sim.D.hist));
    const main = Object.entries(prod).sort((a, b) => b[1] - a[1])[0];
    $('hProd').textContent = main ? `${PRODUCTS[main[0]].name}${d95 && d95 < 9999 ? ' · D95 ' + d95 + ' mm' : ''}` : 'waiting for rock …';
    let val = 0; const qm = Career.quality(sim.D.byMat); for (const k in prod) val += prod[k] * Career.spotPrice(save, k, save.day) * qm;
    $('hKr').textContent = kr(val);
    const st = M.state, chip = $('hState');
    const map = { run: ['Running', 'run'], relief: ['Hydraulics', 'warn'], stop: ['Locked out', 'stop'], trip: ['Overload relay', 'bad'], broken: ['Toggle broken', 'bad'], clearing: ['Clearing', 'warn'] };
    let [txt, cls] = map[st] || ['', ''];
    if (st === 'run' && M.block > 0.6) { txt = 'Overload'; cls = 'bad'; } else if (st === 'run' && M.amps > T.kw * 1.72 * 1.05) { txt = 'High load'; cls = 'warn'; }
    if (st === 'broken' || st === 'clearing' || (st === 'trip' && M.timer > 0)) txt += ' ⏩';
    chip.textContent = txt; chip.className = 'chip ' + cls;
    // ammeter: full scale 2.5 × rated current
    const rated = T.kw * 1.72, f = clamp(M.amps / (rated * 2.5), 0, 1), th = Math.PI + f * Math.PI;
    const n = $('gNeedle'); n.setAttribute('x2', 46 + Math.cos(th) * 34); n.setAttribute('y2', 62 + Math.sin(th) * 34);
    $('gMotor').classList.toggle('hot', st === 'run' && f > 0.72);
    $('gAmp').textContent = Math.round(M.amps) + ' A';
    $('gRpm').textContent = Math.round(M.w * 60 / TAU) + ' rpm';
    $('gPlate').textContent = Math.round(Career.plateLife(save) * 100) + ' %';
    cssT -= 0.1; if (cssT <= 0 || !cssCache) { cssCache = Machine.measure(sim); cssT = 8; }
    $('gCss').textContent = 'CSS ' + Math.round(cssCache.css * sim.mmpx) + ' mm';
    $('bView').textContent = Render.isZoomed() ? '⤡ Close-up' : '⤢ Show all';
    updateTools();
    $('tFeedBar').style.width = (sim.loader.busy ? Math.min(1, sim.loader.t / (sim.loader.exT3 || 3.5)) * 100 : sim.loader.cd > 0 ? (1 - sim.loader.cd / (sim.loader.cd0 || 1)) * 100 : 0) + '%';
  }

  // ---------- loop ----------
  let last = performance.now(), acc = 0, sdt = 0, actK = 0;
  // the breaker boom swings out over the mouth when it is picked, and folds up out of the way when not
  let brVis = null;
  function brPose(dt) {
    if (!sim || !sim.up.breaker) return null;
    if (br) { brVis = { x: br.x, y: br.y }; return br; }
    const T = tool === 'hammer' ? { x: 560, y: 330 } : { x: 900, y: -260 };
    if (!brVis) brVis = { x: T.x, y: T.y };
    const k = 1 - Math.pow(0.002, dt); brVis.x += (T.x - brVis.x) * k; brVis.y += (T.y - brVis.y) * k;
    return { x: brVis.x, y: brVis.y, on: false };
  }
  function frame(now) {
    qualityTick(now - last);
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    if (sim && !(mode === 'shift' && paused)) {
      // real time (1×) or 2×; while the plant stands waiting for a repair, time is spooled forward
      const waiting = mode === 'shift' && (sim.m.state === 'broken' || sim.m.state === 'clearing' || (sim.m.state === 'trip' && sim.m.timer > 0));
      // the view is a close-up of a small machine; at true clock speed it reads like a miniature film
      // (everything looks too fast). Like miniature filming, time is slowed by √(true size / perceived size).
      const timeK = clamp(Math.sqrt(720 * sim.mmpx / 3000), 0.45, 1);
      const spd = timeK * (mode === 'shift' ? (save.speed === 2 ? 2 : 1) : 1);
      sim.skip = waiting ? 14 : 1;   // the clock and the repair run ahead, everything you see moves at its own pace
      sdt = dt * spd;
      acc += sdt; let n = 0;
      const maxN = Math.ceil(spd * 0.05 / STEP) + 1;
      while (acc >= STEP && n < maxN) { sim.step(STEP); acc -= STEP; n++; simTime += STEP; }
      if (n === maxN) acc = 0;
      // demo: keep the hopper fed on the title and office screens
      if (sim.demo) { if (sim.feederRoom() && sim.loader.cd <= 0) { save0Feed(); } if (sim.m.state !== 'run') { if (sim.m.state === 'stop' || (sim.m.state === 'trip' && sim.m.timer <= 0)) sim.start(); } }
      if (mode === 'shift') {
        shiftT += sdt * (sim.skip || 1);
        if (autoFeed && sim.m.state === 'run' && !sim.loader.busy && sim.loader.cd <= 0 && sim.feederRoom()) feed();
        // sledge timing
        if (sl) {
          sl.t += dt;
          if (sl.state === 'charge') { sl.charge = Math.min(1, sl.t / 1.0); const c = sim.sledgeCheck(sl.x); sl.tg = c.tg; sl.ok = c.ok; }
          else if (sl.state === 'swing' && sl.t >= 0.32) { const r = sim.sledgeHit(sl.x, sl.charge); buzz(18 + Math.round(sl.charge * 22)); shake = Math.max(shake, 2 + 3 * sl.charge); sl.state = 'recover'; sl.t = 0; if (r && r.tg) sl.tg = r.tg; hint('t3', 'Blows on corners and edges knock off flakes. The block only splits once the cracks have grown. Strike along the crack.'); }
          else if (sl.state === 'recover' && sl.t > 0.55) sl = null;
        }
        if (br) { br.t -= sdt; if (br.t <= 0) { br.t = 0.125; sim.breakerBlow(br.x, br.y); shake = Math.max(shake, 1.5); } }
        // contextual hints
        if (sim.D.oversizeIn > 0) hint('t2', sim.up.breaker ? 'A block is bigger than the feed opening. Pick Breaker: the boom swings out. Hold your finger on the block and the hammer works on it.' : 'A block is bigger than the feed opening. Pick Sledge, hold your finger on top of the block and release to strike.');
        if (sim.m.block > 0.5) hint('t4', 'The ammeter is spiking: the jaw is getting more than it can handle. Slow the feeder (−), or the overload relay will trip.');
        for (const e of sim.fx) { if (e.t === 'dump') lastLoadT = e.mass * sim.TLm / 1000 * 1.1; if (e.t === 'dirty') toast(sim.up.scalper ? 'Dirty load: the scalper sends the soil and fines to the fill heap.' : e.share > 0.27 ? 'Dirty load: a lot of soil and gravel from the top of the bench. It lowers the quality of the product. A scalper (Equipment) or stripping the overburden (Workshop) helps.' : 'This load has more soil and gravel than usual.', 3600); if (e.t === 'steelIn') hint('t5', 'Steel in the load! A broken bucket tooth. Pry it over the left edge with the pry bar, into the scrap skip on the platform, before it reaches the jaw.', 6000); if (e.t === 'steelOut') toast('Steel went out with the aggregate. The customer complains.', 3200, 'bad'); if (e.t === 'repaired') toast('New toggle plate fitted and the steel removed. Start the crusher.', 3600, 'good'); }
        cssTick(sdt);
        hudT -= dt; if (hudT <= 0) { updateHud(); hudT = 0.1; }
        if (save.sound && !sndWarn && shiftT > 3 && Sound.state !== 'running') { sndWarn = true; Sound.unlock(); toast('No sound? Tap the screen, and check that your phone\'s media volume is turned up.', 4200); }
        if (shiftT >= DAY_LEN && !otAsked) askOvertime();
        else if (otAsked && shiftT >= DAY_LEN * otEnd) { toast(otEnd < OT_MAX - 0.01 ? 'It\'s dark. Time to go home.' : 'It\'s 19:00. Time to go home.', 3000); endShift(false); }
        { const dk = Render.darkness(7 + 8 * shiftT / DAY_LEN, Career.month(save.day)); if (dk > 0.3) sim.D.darkT = (sim.D.darkT || 0) + sdt * (sim.skip || 1) * 8 / DAY_LEN; }
        goalT -= dt; if (goalT <= 0) { goalT = 0.5; goalsTick(sim.D); }
      }
    }
    if (sim) Render.setAction({ k: 0, box: null });   // the camera never moves by itself
    if (sim) {
      const hour = mode === 'shift' ? 7 + 8 * shiftT / DAY_LEN : 10.5;
      const aim = sl && sl.state === 'charge' && sl.tg ? { x: sl.tg.x, y: sl.tg.y, ok: sl.ok, charge: sl.charge } : null;
      Render.frame(sim, mode === 'shift' || mode === 'report' ? save : (save || null), weather, { dt: sdt || dt * 0.5, hour, time: simTime, shake, sledge: sl && sl.tg ? sl : null, aim, breaker: brPose(dt) });
      const beltLoad = sim.parts.reduce((a, p) => a + (p.st === 1 ? 1 : 0), 0);
      Sound.update(sim, { hour, beltLoad, active: mode === 'shift' }, dt);
      sim.fx.length = 0;
    }
    shake *= Math.pow(0.001, dt);
    requestAnimationFrame(frame);
  }
  function save0Feed() {
    const mats = () => [MATS.marmor, MATS.gneis, MATS.skifer][(sim.rng() * 3) | 0];
    sim.callLoader(sim.makeLoad(mats, 0.22), false);
  }
  window.__rcSim = () => sim;   // for automated tests
  requestAnimationFrame(frame);
  sim = demoSim();
  intro();
})();

</script>
